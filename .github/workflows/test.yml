name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Installed wheel smoke test
        working-directory: /tmp
        run: |
          python -c "import strata, importlib.metadata; assert importlib.metadata.version('strata-restructure') == '0.5.2'; from strata import Bundle, ProbabilityPolicy, OperationStream, restructure_file, ConstructorRegistry; from strata.experiments import create_experiment, run_sweep; from strata.experiment_policy import ScreeningPolicy, ContinuationPolicy; from strata.research_ladder import default_research_ladder"
          strata --help
          python -m strata --help
