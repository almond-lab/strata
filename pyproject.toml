[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "strata-restructure"
version = "0.4.1"
description = "Contract-driven circuit restructuring and reproducible evidence on kickmix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kickmix==1.0.0", "numpy>=2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
strata = "strata.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
