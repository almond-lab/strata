[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "strata-restructure"
version = "0.7.0"
description = "Algorithmic co-design, representation discovery, and ultra-low-latency circuit compression on kickmix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kickmix==1.0.0", "numpy>=2", "python-sat>=1.9.dev23"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
strata = "strata.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
